name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new Flutter release cannot turn CI red on its own. Raise it
  # deliberately, with a run of the test suite behind the change.
  FLUTTER_VERSION: 3.47.5

jobs:
  analyse:
    name: Analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyse
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # The suite already fails if the return to player leaves its band. This
      # prints the figures so a reviewer can see what a paytable change did
      # without checking the branch out.
      - name: Report return to player
        run: dart run tool/exact_rtp.dart

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Debug rather than release: it exercises the same Gradle and plugin
      # wiring, which is what breaks, without paying for AOT on every push.
      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slot-game-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
