include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Command-line tooling in tool/ reports to stdout on purpose.
    avoid_print: ignore
  exclude:
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
